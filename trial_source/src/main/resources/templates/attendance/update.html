<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title>勤怠情報変更｜LMS</title>
</head>

<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>


	<div class="row">
		<div class="bs-component col-sm-12">

			<form th:action="@{/attendance/update}" th:object="${attendanceForm}" method="post">
				
				<!-- エラーメッセージ表示 -->
				<div class="alert alert-danger"
    	 			th:if="${#fields.hasAnyErrors()}">
    				<ul>
        				<li th:each="error : ${#fields.allErrors()}"
            				th:text="${error}">
        				</li>
    				</ul>
				</div>
	
				<table class="table table-hover dataTable no-footer">
					<thead style="display: block;">
						<tr>
							<th class="w140">日付</th>
							<th class="w300">コース内容</th>
							<th class="w60"></th>
							<th class="w180" colspan="3">出勤</th>
							<th class="w180" colspan="3">退勤</th>
							<th class="w80">中抜け時間</th>
							<th class="w70">ステータス</th>
							<th class="w240">備考</th>
						</tr>
					</thead>
					<tbody style="display: block; overflow-y: scroll; height: 560px;">
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|"
										th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|"
										th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|"
										th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|"
										th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|"
										th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|"
										th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
								<td class="w300">[[${dailyAttendanceForm.sectionName}]]</td>
								
								<td class="w60"><input type="button" class="btn btn-success" value="定時" /></td>
								
								<td class="w80">
									<select th:name="|attendanceList[${stat.index}].trainingStartTimeHour|"
										th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingStartTime')} ? ' errorInput' : ''"
										class="form-control">
										<option th:each="hour : ${attendanceForm.hourMap}" th:value="${hour.key}"
											th:inlne="text" class="form-control"
											th:selected="${hour.key == dailyAttendanceForm.trainingStartTimeHour}">
											[[${hour.value}]]
										</option>
									</select>
								</td>
								<td>:</td>
								<td class="w80">
									<select th:name="|attendanceList[${stat.index}].trainingStartTimeMinits|"
										th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingStartTime')} ? ' errorInput' : ''"
										class="form-control">
										<option th:each="minit : ${attendanceForm.minitsMap}" th:value="${minit.key}"
											th:inlne="text" class="form-control"
											th:selected="${minit.key == dailyAttendanceForm.trainingStartTimeMinits}">
											[[${minit.value}]]
										</option>
									</select>
								</td>
								<td class="w80">
									<select th:name="|attendanceList[${stat.index}].trainingEndTimeHour|"
										th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingEndTime')} ? ' errorInput' : ''"
										class="form-control">
										<option th:each="hour : ${attendanceForm.hourMap}" th:value="${hour.key}"
											th:inlne="text" class="form-control"
											th:selected="${hour.key == dailyAttendanceForm.trainingEndTimeHour}">
											[[${hour.value}]]
										</option>
									</select>
								</td>
								<td>:</td>
								<td class="w80">
									<select th:name="|attendanceList[${stat.index}].trainingEndTimeMinits|"
										th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingEndTime')} ? ' errorInput' : ''"
										class="form-control">
										<option th:each="minit : ${attendanceForm.minitsMap}" th:value="${minit.key}"
											th:inlne="text" class="form-control"
											th:selected="${minit.key == dailyAttendanceForm.trainingEndTimeMinits}">
											[[${minit.value}]]
										</option>
									</select>
								</td>
								<td class="w80">
									<select th:name="|attendanceList[${stat.index}].blankTime|" class="form-control">
										<option th:each="blankTime : ${attendanceForm.blankTimes}"
											th:value="${blankTime.key}" th:inlne="text" class="form-control"
											th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">
											[[${blankTime.value}]]</option>
									</select>
								</td>
								<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td>
								<td class="w240">
									<input type="text" th:name="|attendanceList[${stat.index}].note|"
										th:value="${dailyAttendanceForm.note}"
										th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].note')} ? ' errorInput' : ''"
										class="form-control">
									</input>
								</td>
							</tr>
						</th:block>
					</tbody>
				</table>

				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					 <input type="submit" name="complete" class="btn btn-info" value="更新"
                    	onclick="return registCheck();" />
				</div>

			</form>
		</div>
	</div>
	
	<script>
    document.addEventListener('DOMContentLoaded', function () {
        // 「定時」ボタンをすべて取得
        const buttons = document.querySelectorAll(
            'input[type="button"].btn-success'
        );

        buttons.forEach(function (button) {
            button.addEventListener('click', function () {
                // ボタンがある行を取得
                const row = button.closest('tr');

                // 出勤 09:00
                row.querySelector(
                    'select[name$=".trainingStartTimeHour"]'
                ).value = '9';

                row.querySelector(
                    'select[name$=".trainingStartTimeMinits"]'
                ).value = '0';

                // 退勤 18:00
                row.querySelector(
                    'select[name$=".trainingEndTimeHour"]'
                ).value = '18';

                row.querySelector(
                    'select[name$=".trainingEndTimeMinits"]'
                ).value = '0';
            });
        });
    });
</script>

<script>
      function registCheck() {
        if (confirm("更新します。よろしいですか？")) {
          return true;
        }	
        else {
          return false;
        }
      }
    </script>

</body>

</html>
